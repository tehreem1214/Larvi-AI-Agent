[project]
name = "larvi-ai-agent"
version = "0.1.0"
description = "Larvi AI Agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]",
    "uvicorn",
    "google-api-python-client",
    "google-auth",
    "google-auth-oauthlib",
    "google-auth-httplib2",
    "python-dotenv",
    "langchain",
    "langchain-openai",
    "langgraph",
    "ollama",
    "openai",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]